name: Deploy website

on:
  push:
    branches: ["main"]

  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Calculate Hash
        id: hash
        run: |
          cd "${{ github.workspace }}/src/show-program"
          echo "HASH=$(sum go.mod go.sum Makefile *.tmpl *.go | sum | awk '{ print $1 }')" >> $GITHUB_OUTPUT

      - name: Restore Cached Binary
        id: cache-binary
        uses: actions/cache@v4
        with:
          path: src/show-program/show-program
          key: binary-${{ runner.os }}-${{ steps.hash.outputs.HASH }}

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: src/show-program/go.mod
          cache-dependency-path: |
            src/show-program/go.sum
            src/open-workshops/go.sum
            src/html-to-png/go.sum

      - name: Build binary
        if: steps.cache-binary.outputs.cache-hit != 'true'
        run: |
          cd "${{ github.workspace }}/src/show-program"
          go build -o show-program .

      - name: Disable AppArmor for Chrome
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Generate show site
        run: |
          cd "${{ github.workspace }}/src/show-program"
          mkdir -p output/screenshots
          echo ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEYFILE_BASE64 }} | base64 -d > impro-neuf-management-99d59b5d3102.json
          chmod +x show-program
          ./show-program
          cp -R icons output/screenshots/icons

      - name: Generate workshop banners and manifest
        run: |
          cd "${{ github.workspace }}/src/open-workshops"
          go run main.go
          cd ../html-to-png
          go run convert-workshops.go
          test -s ../open-workshops/output/banners.json
          python3 -m json.tool ../open-workshops/output/banners.json > /dev/null
          find ../open-workshops/output -name '*-fb.jpg' -print -quit | grep -q .

      - name: Assemble Pages site
        run: |
          cd "${{ github.workspace }}"
          mkdir -p _site/open-workshops/output
          cp -R src/show-program/output/screenshots/. _site/
          cp -R src/open-workshops/output/. _site/open-workshops/output/
          cp src/open-workshops/output/banners.json _site/workshop-banners.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
